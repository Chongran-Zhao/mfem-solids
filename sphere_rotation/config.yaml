# Input of read_mesh of sphere_rotation. CMake copies it into
# sphere_rotation/build/, and the programs read the copy of the directory they
# run in, or the file given as first argument. Lengths are in meters.

mesh:
  # Radius of the sphere.
  radius: 0.06525

  # Half-size of the inner cube, as a fraction of the radius, in (0, 1).
  inner_size: 0.4

  # Elements of the inner cube per direction, even, so that the center of
  # the sphere is a vertex.
  inner_elements: 8

  # Element layers of the shell between the cube and the sphere surface, and
  # the thickness of the outermost layer over that of the innermost one.
  radial_elements: 10
  radial_ratio: 0.5

  # Name of the mesh file written by read_mesh.
  output: sphere.mesh

space:
  # Order of the continuous shape functions of the displacement, at least 2,
  # and of the curved geometry; the pressure is one order lower
  # (Taylor-Hood).
  order: 2
