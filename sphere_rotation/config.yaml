# Input of read_mesh, driver, vtu_writer and csv_writer of sphere_rotation.
# CMake copies it into sphere_rotation/build/, and the programs read the copy
# of the directory they run in, or the file given as first argument. Units
# are SI: meters, seconds. The surface of the ball turns about z as given by
# LoadData; the body starts at rest.

mesh:
  # Outer radius of the ball, that of the skull, and radius of the gelatin
  # inside; without skull, gelatin_radius = radius.
  radius: 0.0957596
  gelatin_radius: 0.089

  # Half-size of the inner cube, as a fraction of the gelatin radius, in
  # (0, 1).
  inner_size: 0.4

  # Elements of the inner cube per direction, even, so that the center of
  # the sphere is a vertex.
  inner_elements: 8

  # Element layers of the gelatin shell between the cube and the gelatin
  # surface, and the thickness of the outermost layer over that of the
  # innermost one.
  radial_elements: 10
  radial_ratio: 0.5

  # Element layers of the skull, of even thickness; 0 for no skull.
  skull_elements: 2

  # inner_elements, radial_elements and skull_elements set the mesh size: to
  # refine, double all three, which gives 8 times the elements,
  # 8^3 + 6 x 8^2 x (10 + 2) = 5120 here.
  # The mesh is generated anew, so that every node lies on the map to the
  # ball and the layers keep their smooth grading; there is no separate
  # uniform refinement.

  # Name of the mesh file written by read_mesh.
  output: sphere.mesh

space:
  # Order of the continuous shape functions of the displacement, at least 2,
  # and of the curved geometry; the pressure is one order lower
  # (Taylor-Hood).
  order: 2

  # Quadrature order of the elements: 5 is the 3 x 3 x 3 Gauss rule, exact
  # for Q2 on straight elements; the default of the other cases would give
  # the curved Q2 elements 6 x 6 x 6 points.
  quad_order: 5

# Time integration method, read into TimeMethod_GenAlpha.
time_method:
  # Spectral radius at infinite frequency of generalized-alpha, in [0, 1].
  rho_inf: 0.5

# Time steps, read into TimeSolver_Dynamic_Mixed.
time:
  # Time step; the last step is shortened to end at final_time.
  dt: 1.0e-4
  final_time: 0.03

# Displacement boundary conditions: the whole surface follows the rotation of
# LoadData::disp_loading.
Dirichlet:
  fixed_bc: []
  disp_bc:
    - { face: outer, dir: x }
    - { face: outer, dir: y }
    - { face: outer, dir: z }

# No traction.
Neumann:
  faces: []

# Newton's method settings, and those of GMRES, the linear solver, with the
# block preconditioner of NonlinearSolver_Dynamic_Mixed.hpp of this folder.
# The residual of the stiff skull cannot drop below about 1e-9 N, its bulk
# modulus, about 3e9 Pa, times the round-off of J - 1, so newton_abs_tol is
# above that. With the skull started from the rotation of its surface, one
# Newton iteration brings the residual to about 1e-6 of its start, which
# newton_rel_tol = 1e-5 accepts; the fields then differ from those of 1e-7
# by less than 1e-6.
solver:
  newton_rel_tol: 1.0e-5
  newton_abs_tol: 1.0e-8
  newton_max_iter: 20
  linear_rel_tol: 1.0e-8
  linear_max_iter: 200

# Faces and directions reported by csv_writer; csv_writer also writes the
# energies of the whole body.
csv_writer:
  - { face: outer, dir: x }
  - { face: outer, dir: y }
  - { face: outer, dir: z }

# Output folders, in the directory the programs run in.
output:
  vtu: results_vtu
  gf: results_gf
  csv: results_csv
