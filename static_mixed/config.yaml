# Input of the driver of static_mixed.
# CMake copies it into static_mixed/build/, and the driver reads the copy of
# the directory it runs in, or the file given as first argument. The mesh is
# the beam.mesh of read_mesh, in that directory.
# driver and csv_writer run on MPI ranks, e.g. mpirun -np 4 ./driver; the
# driver saves its results with the mesh they live on, output.gf/mesh.mesh,
# which vtu_writer and csv_writer read.

mesh:
  # Mesh file in MFEM format.
  file: mesh_files/Beam_coarse-hex.mesh

  # Number of uniform refinements.
  refine_levels: 0

  # Name of the mesh file written by read_mesh.
  output: beam.mesh

  # Web page showing the named faces in 3D, and whether to open it.
  output_html: beam_boundary.html
  open_html: true

space:
  # Order of the continuous shape functions.
  order: 2

# Loading settings.
loading:
  # Number of load steps; the final load is reached in equal steps.
  load_steps: 25
  # Loading type, displacement or traction.
  type: displacement

# Displacement boundary conditions, one entry per face and direction.
Dirichlet:
  # Zero displacement.
  fixed_bc:
    - { face: left, dir: x }
    - { face: left, dir: y }
    - { face: left, dir: z }
  # Prescribed displacement, given by LoadData::disp_loading.
  disp_bc:
    - { face: right, dir: z }

# Traction faces; the traction is given by LoadData::surface_traction.
Neumann:
  faces: []
# faces: [right, top]

# Newton's method settings.
solver:
  newton_rel_tol: 1.0e-8
  newton_abs_tol: 0.0
  newton_max_iter: 20
  # Linear solver of the tangents and of the mass: mumps, the parallel
  # direct solver, or iterative, Krylov preconditioned by BoomerAMG: CG for
  # the mass, BiCGSTAB with a block preconditioner for the block tangent.
  # The tolerances, the iteration limit and print, which prints the
  # iterations of every solve, are those of the Krylov solver.
  linear_solver:
    type: mumps
    rel_tol: 1.0e-10
    abs_tol: 0.0
    max_iter: 2000
    print: false

# Faces and directions reported by csv_writer, one entry per face and
# direction.
csv_writer:
  - { face: left, dir: z }
  - { face: right, dir: z }

# Output folders, in the directory the programs run in.
output:
  vtu: results_vtu
  gf: results_gf
  csv: results_csv
