# Input of driver_vms_dynamic, which reads it by default, and of read_mesh, vtu_writer
# and probe_disp of sphere_rotation, given as their first argument; CMake
# copies it into sphere_rotation/build/. Units are SI: meters, seconds. The surface of the ball turns about z by the
# measured angle of LoadData; the body starts at rest.

mesh:
  # Outer radius of the ball, that of the skull, and radius of the gelatin
  # inside, gelatin_radius < radius.
  radius: 0.0957596
  gelatin_radius: 0.089

  # Half-size of the inner cube, as a fraction of the gelatin radius, in
  # (0, 1).
  inner_size: 0.4

  # Elements of the inner cube per direction, even, so that the center of
  # the sphere is a vertex.
  inner_elements: 8

  # Element layers of the gelatin shell between the cube and the gelatin
  # surface, and the thickness of the outermost layer over that of the
  # innermost one.
  radial_elements: 10
  radial_ratio: 0.5

  # Element layers of the skull, of even thickness, at least 1.
  skull_elements: 2

  # inner_elements, radial_elements and skull_elements set the mesh size: to
  # refine, double all three, which gives 8 times the elements,
  # 8^3 + 6 x 8^2 x (10 + 2) = 5120 here.
  # The mesh is generated anew, so that every node lies on the map to the
  # ball and the layers keep their smooth grading; there is no separate
  # uniform refinement.

  # Name of the mesh file written by read_mesh.
  output: sphere.mesh

space:
  # Order of the continuous shape functions of the velocity and of the
  # pressure, equal (1: Q1/Q1, 2: Q2/Q2), stabilized by VMS, and of the
  # geometry.
  elem_order: 1

  # Quadrature order of the elements, 2 x elem_order + 1: the
  # (elem_order + 1)^3 Gauss rule, 2 x 2 x 2 points for Q1 here (5 for Q2);
  # 0 keeps the default rule, 2 x LocalAssemblyTools OrderGrad.
  quad_order: 3

  # Factor of the VMS parameter tau = tau_factor dx J / (c rho_0 k^2) of the
  # incompressible regions, the gelatin: dx the longest diagonal of the
  # element, c = sqrt(mu / rho_0) and k the element order; 0.01 is that of
  # PERIGEE. The compressible skull has tau = 0, as in PERIGEE.
  tau_factor: 0.01

# The measured rotation of the surface, read by LoadData::read_rotation: the
# piecewise quintic angle theta(t) fitted to the measurements, one row per
# interval (t_start, t_end, c5, ..., c0, in seconds), in the directory the
# programs run in; CMake copies it into the build folder.
loading:
  rotation_file: angle_coefficients.csv

# Time integration method, read into TimeMethod_GenAlpha_1st_Order.
time_method:
  # Spectral radius at infinite frequency of generalized-alpha, in [0, 1].
  rho_inf: 0.5

# Time steps, read into TimeSolver.
time:
  # Time step; the last step is shortened to end at final_time, at most the
  # end of the measured rotation of LoadData, 0.153 s.
  dt: 1.0e-4
  final_time: 0.153

# Displacement boundary conditions: the whole surface follows the rotation of
# LoadData::disp_loading, its velocity that of LoadData::velo_loading.
Dirichlet:
  fixed_bc: []
  disp_bc:
    - { face: outer, dir: x }
    - { face: outer, dir: y }
    - { face: outer, dir: z }

# No traction.
Neumann:
  faces: []

# Newton's method settings; the linear solver is GMRES, with the block
# preconditioner of include/NonlinearSolver_VMS_Dynamic.hpp. The
# residual of the stiff skull cannot drop below about 1e-9 N, its bulk
# modulus, about 3e9 Pa, times the round-off of J - 1, so newton_abs_tol is
# above that. With the skull started from the rotation of its surface, the
# residual starts at about 1 N with Taylor-Hood; newton_rel_tol and
# newton_abs_tol are those of config_TaylorHood_dynamic.yaml.
solver:
  # Solver of the tangents: gmres, with the preconditioner of
  # include/NonlinearSolver_VMS_Dynamic.hpp, or mumps, a direct solver.
  linear_solver: gmres
  newton_rel_tol: 1.0e-5
  newton_abs_tol: 1.0e-8
  newton_max_iter: 20

# Output folders, in the directory the programs run in, and the VTU output:
# every vtu_interval-th saved step, and the last, with each element cut into
# vtu_refine^3 hexahedra at its sampling points; the files grow as
# (vtu_refine + 1)^3.
output:
  vtu: results_vms_dynamic_vtu
  vtu_interval: 10
  # 1 for Q1, 2 to show the quadratic fields of Q2.
  vtu_refine: 1
  gf: results_vms_dynamic_gf
  # The fields are saved every gf_interval-th time step, and at the last;
  # vtu_interval counts the saved steps.
  gf_interval: 1
