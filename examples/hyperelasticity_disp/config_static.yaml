# Input of driver_static, which reads it by default, and of read_mesh,
# vtu_writer and csv_writer of hyperelasticity_disp, given as their first
# argument; CMake copies it into hyperelasticity_disp/build/. mesh.file is
# relative to the project directory. The loading functions of LoadData receive the time, here the
# load factor in [0, 1].
# The case is the beam fixed on its left face, its right face moved along z
# by LoadData::disp_loading.

mesh:
  # Mesh file in MFEM format.
  file: mesh_files/Beam_coarse-hex.mesh

  # Number of uniform refinements.
  refine_levels: 0

  # Name of the mesh file written by read_mesh.
  output: beam.mesh

  # Web page showing the named faces in 3D, and whether to open it.
  output_html: beam_boundary.html
  open_html: true

space:
  # Order of the continuous shape functions.
  elem_order: 1

  # Quadrature order of the elements, 2 x elem_order + 1: the
  # (elem_order + 1)^3 Gauss rule, 2 x 2 x 2 points for Q1 here; 0 keeps the
  # default rule, 2 x LocalAssemblyTools OrderGrad, 3 x 3 x 3 points here.
  quad_order: 3

# Time steps, read into TimeSteps.
time:
  # num_steps equal steps up to final_time, or a time step dt; with
  # final_time 1 the time of step n is the load factor n / num_steps.
  num_steps: 25
  final_time: 1.0

# Displacement boundary conditions, one entry per face and direction.
Dirichlet:
  # Zero displacement.
  fixed_bc:
    - { face: left, dir: x }
    - { face: left, dir: y }
    - { face: left, dir: z }
  # Prescribed displacement, given by LoadData::disp_loading.
  disp_bc:
    - { face: right, dir: z }

# Traction faces; the traction is given by LoadData::surface_traction.
Neumann:
  faces: []
# faces: [right, top]

# Newton's method settings.
solver:
  # Solver of the tangents: gmres, with the preconditioner of
  # include/NonlinearSolver.hpp of this case, or mumps, a direct solver.
  linear_solver: gmres
  newton_rel_tol: 1.0e-8
  newton_abs_tol: 0.0
  newton_max_iter: 20

# Faces and directions reported by csv_writer, one entry per face and
# direction; csv_writer also writes the strain energy of the whole body.
csv_writer:
  - { face: left, dir: z }
  - { face: right, dir: z }

# Output folders, in the directory the programs run in.
output:
  vtu: results_static_vtu
  # vtu_writer cuts each element into vtu_refine^3 hexahedra at its
  # (vtu_refine + 1)^3 sampling points; 1, the element itself, suffices for
  # Q1, whose fields are linear in each direction.
  vtu_refine: 1
  gf: results_static_gf
  # The fields are saved every gf_interval-th time step, and at the last.
  gf_interval: 1
  csv: results_static_csv
