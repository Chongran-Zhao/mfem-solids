# Input of driver, read_mesh and vtu_writer of elastic_fracture, given as
# their first argument, else config.yaml; CMake copies it into
# elastic_fracture/build/. mesh.file is relative to the project directory.
# The case is the helical crack of Bourdin (The variational formulation of
# brittle fracture: numerical implementation and extensions, 2007, Section
# 3), as set up in the mef90 runs of ~/runs/HelicalCrack2007L016: a cylinder
# of radius 1 and length 10 with an unbreakable shaft of radius .5, capped at
# both ends, clamped at the bottom, with an initial crack inside, pulled by
# a body force along +z on the top cap, LoadData::body_force. The regions,
# the shaft and the caps that do not break and the stiffer caps, are in
# MaterialModelData.

mesh:
  # Mesh file, Gmsh 2.2, of mesh_files/HelicalCrack2007.geo with h = .08,
  # 59,411 vertices; not kept in git, made from the project directory by
  #    gmsh -3 -setnumber h 0.08 mesh_files/HelicalCrack2007.geo -o mesh_files/HelicalCrack2007-h008.msh
  file: mesh_files/HelicalCrack2007-h008.msh

  # Names of the boundary attributes of the mesh file, the physical tags of
  # a Gmsh file; the boundary conditions and the initial crack refer to the
  # faces by these names.
  faces:
    clamped: 20   # bottom face of the bottom cap, z = -.5
    top: 30       # both faces of the top cap, z = 10 and 10.5
    crack: 40     # initial crack, a disk of radius .4 at z = 5, tilted by 30 degrees

  # Number of uniform refinements.
  refine_levels: 0

  # Name of the mesh file written by read_mesh.
  output: helical.mesh

  # Web page showing the named faces in 3D, and whether to open it.
  output_html: helical_boundary.html
  open_html: false

space:
  # Order of the continuous shape functions, of the displacement and of the
  # phase field.
  elem_order: 1

  # Quadrature order of the elements; 0 keeps the default rule of
  # LocalAssemblyTools, only 1 point on a linear tetrahedron. 2 integrates
  # g(alpha) psi_e and w(alpha) exactly on linear elements; on hexahedra it
  # is the same rule as 3, 2 x 2 x 2 points.
  quad_order: 2

# Load steps, read into TimeSteps: steps of .02 as in the mef90 runs, up to
# t = 1.9, past both jumps of Fig. 2 of the paper.
time:
  dt: 0.02
  final_time: 1.9

# Displacement boundary conditions, one entry per face and direction.
Dirichlet:
  # Zero displacement.
  # The clamped face; on the faces of the top cap ux = uy = 0, so that the
  # cap cannot rotate, as in the mef90 runs, not in the paper.
  fixed_bc:
    - { face: clamped, dir: x }
    - { face: clamped, dir: y }
    - { face: clamped, dir: z }
    - { face: top, dir: x }
    - { face: top, dir: y }
  # Prescribed displacement, given by LoadData::disp_loading: none.
  disp_bc: []

# Traction faces; the traction is given by LoadData::surface_traction.
Neumann:
  faces: []

# Alternate minimization.
fracture:
  # A node joins the crack set K_n, alpha = 0, when alpha_n <= eta_lim;
  # mef90's irrevThres .99 for its damage 1 - alpha.
  eta_lim: 1.0e-2
  # Faces of the initial crack, named in mesh.faces, where alpha = 0 at
  # every step.
  initial_crack: [crack]
  # Tolerance on ||alpha^(j+1) - alpha^(j)||_inf, and the maximum of
  # iterations per load step.
  tol: 1.0e-6
  max_iter: 1000

# Newton's method of the displacement problem; linear in the displacement
# for a linear elastic material, so that the predictor already solves it and
# the absolute tolerance must be positive. linear_solver gmres, preconditioned
# by BoomerAMG, or mumps: on the helical mesh, 8 ranks, a load step took 11 s
# with gmres for both problems and 65 s with mumps for both, for the same
# energies; mumps is the fallback should gmres stall once the crack opens,
# where the stiffness falls to eta.
solver_disp:
  linear_solver: gmres
  newton_rel_tol: 1.0e-8
  newton_abs_tol: 1.0e-10
  newton_max_iter: 20

# Newton's method of the phase-field problem, linear in alpha for AT2.
solver_fracture:
  linear_solver: gmres
  newton_rel_tol: 1.0e-8
  newton_abs_tol: 1.0e-10
  newton_max_iter: 20

# Output folders, in the directory the programs run in.
output:
  vtu: results_vtu
  # vtu_writer cuts each element into vtu_refine^3 cells at its sampling
  # points; 1, the element itself, suffices for linear elements.
  vtu_refine: 1
  # The points at the reference positions X, else at X + u. Where the
  # material is broken its stiffness is about eta and the displacement
  # across the crack is large, which X + u would stretch the cells by;
  # ParaView's Warp By Vector of displacement draws the deformed shape.
  vtu_reference: true
  gf: results_gf
  # The fields are saved every gf_interval-th load step, and at the last.
  gf_interval: 1
