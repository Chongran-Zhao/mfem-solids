# Input of read_mesh, driver and vtu_writer of elastic_fracture, given as
# their first argument (else config.yaml). Units: SI (m, N, Pa, J).
#
# The helical crack of Bourdin, Francfort and Marigo (J. Elasticity 2008,
# Section 6, Fig. 30) with the material of a real spicule: a tube 30 mm long
# and 2 mm across with an unbreakable core 1 mm across, a half-disk notch in
# the middle cross-section, clamped at the left end and pulled by delta at the
# right one. E, nu, G_c, the length scale eps and AT1 are in
# include/MaterialModelData.hpp, not here.
#
# Paths:
#   - mesh.file: relative to the mfem-solids folder, or absolute.
#   - mesh.output, mesh.output_html, output.gf, output.vtu: relative to the
#     folder the programs are run in, or absolute, e.g.
#        gf: /users/me/runs/spicule/results_gf
#     Folders are created if missing; output.gf is emptied at the start of
#     each run of driver. The folder of mesh.output must exist.

mesh:
  # The tube in meters, h = 1.5e-4 m, 27,963 vertices; made from the
  # mfem-solids folder by
  #    gmsh -3 -setnumber h 0.15 -string "Mesh.ScalingFactor=0.001;" mesh_files/HelicalCrack2008.geo -o mesh_files/HelicalCrack2008-h015-m.msh
  # (h in mm in the .geo). For a finer mesh change h, and eps in
  # MaterialModelData.hpp with it.
  file: mesh_files/HelicalCrack2008-h015-m.msh
  # Boundary attributes (Gmsh physical tags) by name.
  faces:
    left: 10      # x = -.015
    right: 20     # x = .015
    crack: 40     # initial crack, a half disk of radius 4e-4 in x = 0
  refine_levels: 0               # uniform refinements
  output: tube.mesh              # mesh written by read_mesh, read by driver
  output_html: tube_boundary.html
  open_html: false

space:
  elem_order: 1
  quad_order: 2

# Load steps: t is the displacement delta (m) of the right end.
time:
  dt: 5.0e-6
  final_time: 2.5e-4

Dirichlet:
  # Zero displacement. Left end clamped; right end held across,
  # u = (delta, 0, 0). Delete the two "right" lines to leave it free across.
  fixed_bc:
    - { face: left, dir: x }
    - { face: left, dir: y }
    - { face: left, dir: z }
    - { face: right, dir: y }
    - { face: right, dir: z }
  # u_x = delta at the right end.
  disp_bc:
    - { face: right, dir: x }

Neumann:
  faces: []

# Alternate minimization: alpha = 0 on the initial crack; a load step stops
# at ||alpha^(j+1) - alpha^(j)||_inf <= tol. backtracking: true goes back to
# an earlier step j whose energy the state of step i, scaled to t_j, beats by
# backtracking_tol (J) or more (Bourdin, Francfort and Marigo 2008,
# Algorithm 2); it needs the loads proportional to t.
fracture:
  initial_crack: [crack]
  tol: 1.0e-3
  max_iter: 3000
  backtracking: false
  backtracking_tol: 1.0e-6

# linear_solver: gmres (BoomerAMG) or mumps.
solver_disp:
  linear_solver: gmres
  newton_rel_tol: 1.0e-8
  newton_abs_tol: 1.0e-10
  newton_max_iter: 20

# Phase field with 0 <= alpha <= 1 (PETSc SNESVINEWTONRSLS); the absolute
# tolerance is in J.
solver_fracture:
  linear_solver: gmres
  newton_rel_tol: 1.0e-5
  newton_abs_tol: 1.0e-10
  newton_step_tol: 1.0e-7
  newton_max_iter: 20

output:
  gf: results_gf           # fields of driver, every gf_interval-th step and the last
  gf_interval: 1
  vtu: results_vtu         # ParaView files of vtu_writer, from output.gf
  vtu_refine: 1            # each element cut into vtu_refine^3 cells
  vtu_reference: false     # false: points at x = X + u; true: at X
