# Input of driver_vms_dynamic, which reads it by default, and of read_mesh,
# vtu_writer and csv_writer of hyperelasticity_mixed, given as their first
# argument; CMake copies it into hyperelasticity_mixed/build/. mesh.file is
# relative to the project directory. Times are physical, in seconds; the
# loading functions of LoadData receive the physical time. The initial
# velocity is LoadData::initial_velo, and the initial displacement and
# pressure zero.
# The case is the beam fixed on its left face, set swinging along z by the
# initial velocity, without load.

mesh:
  # Mesh file in MFEM format.
  file: mesh_files/Beam_coarse-hex.mesh

  # Number of uniform refinements.
  refine_levels: 0

  # Name of the mesh file written by read_mesh.
  output: beam.mesh

  # Web page showing the named faces in 3D, and whether to open it.
  output_html: beam_boundary.html
  open_html: false

space:
  # Order of the continuous shape functions of the displacement and of the
  # pressure, equal (Q1/Q1, Q2/Q2), stabilized by VMS.
  elem_order: 1

  # Quadrature order of the elements, 2 x elem_order + 1: the
  # (elem_order + 1)^3 Gauss rule, 2 x 2 x 2 points for Q1 here; 0 keeps the
  # default rule, 2 x LocalAssemblyTools OrderGrad.
  quad_order: 3

  # Factor of the VMS parameter tau = tau_factor dx J / (c rho_0 k^2): dx the
  # longest diagonal of the element, c the largest wave speed and k the
  # element order, the tau of PERIGEE for k = 1. PERIGEE
  # takes 0.01 for an incompressible material and 0 for a compressible one,
  # whose mass equation holds dp/dt / kappa and needs no stabilization; 0.01
  # over-smooths the pressure of this compressible beam.
  tau_factor: 0.0

# Time integration method, read into TimeMethod_GenAlpha_1st_Order.
time_method:
  # Spectral radius at infinite frequency of generalized-alpha, in [0, 1];
  # 1 is the midpoint rule, without numerical damping. 0.5 damps the high
  # frequencies of Q2, unresolved by dt, which make the pressure oscillate.
  rho_inf: 0.5

# Time steps, read into TimeSolver.
time:
  # Time step; the last step is shortened to end at final_time.
  dt: 0.01
  final_time: 5.0

# Displacement boundary conditions, one entry per face and direction.
Dirichlet:
  # Zero displacement.
  fixed_bc:
    - { face: left, dir: x }
    - { face: left, dir: y }
    - { face: left, dir: z }
  # Prescribed displacement, given by LoadData::disp_loading.
  disp_bc: []

# Traction faces; the traction is given by LoadData::surface_traction.
Neumann:
  faces: []

# Newton's method settings.
solver:
  # Solver of the tangents: gmres, with the preconditioner of
  # include/NonlinearSolver_VMS_Dynamic.hpp, or mumps, a direct solver.
  linear_solver: gmres
  newton_rel_tol: 1.0e-8
  newton_abs_tol: 1.0e-10
  newton_max_iter: 20

# Faces and directions reported by csv_writer, one entry per face and
# direction; csv_writer also writes the energies of the whole body.
csv_writer:
  - { face: left, dir: z }
  - { face: right, dir: z }

# Output folders, in the directory the programs run in.
output:
  vtu: results_vms_dynamic_vtu
  # vtu_writer cuts each element into vtu_refine^3 hexahedra at its
  # (vtu_refine + 1)^3 sampling points; 1 for Q1, 2 to show the quadratic
  # fields of Q2. The files grow as (vtu_refine + 1)^3.
  vtu_refine: 1
  gf: results_vms_dynamic_gf
  # The fields are saved every gf_interval-th time step, and at the last.
  gf_interval: 1
  csv: results_vms_dynamic_csv
