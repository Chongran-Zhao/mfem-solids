# Static input of read_mesh, driver, vtu_writer and csv_writer of
# hyperelasticity_mixed_TaylorHood, the file given as their first argument;
# CMake copies it into hyperelasticity_mixed_TaylorHood/build/. mesh.file is
# relative to the project directory. The loading functions of LoadData
# receive the time, here the load factor in [0, 1].
# The case is the beam fixed on its left face, its right face moved along z
# by LoadData::disp_loading.

mesh:
  # Mesh file in MFEM format.
  file: mesh_files/Beam_coarse-hex.mesh

  # Number of uniform refinements.
  refine_levels: 0

  # Name of the mesh file written by read_mesh.
  output: beam.mesh

  # Web page showing the named faces in 3D, and whether to open it.
  output_html: beam_boundary.html
  open_html: true

space:
  # Order of the continuous shape functions of the displacement, at least 2;
  # the pressure is one order lower (Taylor-Hood).
  elem_order: 2

  # Quadrature order of the elements, 2 x elem_order + 1: the
  # (elem_order + 1)^3 Gauss rule, 3 x 3 x 3 points for Q2 here; 0 keeps the
  # default rule, 2 x LocalAssemblyTools OrderGrad, 4 x 4 x 4 points here,
  # about 1.5 times slower on this beam, which changes its displacement by
  # about 1e-5 and its pressure by about 1e-3.
  quad_order: 5

# Time integration method: static, without inertia, or gen_alpha, the
# generalized-alpha method, read into TimeMethod_GenAlpha_2nd_Order.
time_method:
  type: static

# Time steps, read into TimeSteps.
time:
  # num_steps equal steps up to final_time, or a time step dt; with
  # final_time 1 the time of step n is the load factor n / num_steps.
  num_steps: 25
  final_time: 1.0

# Displacement boundary conditions, one entry per face and direction.
Dirichlet:
  # Zero displacement.
  fixed_bc:
    - { face: left, dir: x }
    - { face: left, dir: y }
    - { face: left, dir: z }
  # Prescribed displacement, given by LoadData::disp_loading.
  disp_bc:
    - { face: right, dir: z }

# Traction faces; the traction is given by LoadData::surface_traction.
Neumann:
  faces: []
# faces: [right, top]

# Newton's method settings.
solver:
  # Solver of the tangents: gmres, with the preconditioner of
  # include/NonlinearSolver.hpp of this case, or mumps, a direct solver.
  linear_solver: gmres
  newton_rel_tol: 1.0e-8
  newton_abs_tol: 0.0
  newton_max_iter: 20

# Faces and directions reported by csv_writer, one entry per face and
# direction; csv_writer also writes the strain energy of the whole body.
csv_writer:
  - { face: left, dir: z }
  - { face: right, dir: z }

# Output folders, in the directory the programs run in.
output:
  vtu: results_vtu
  # vtu_writer cuts each element into vtu_refine^3 hexahedra at its
  # (vtu_refine + 1)^3 sampling points, so that the curved elements and the
  # quadratic fields of Q2 show; the files grow as (vtu_refine + 1)^3.
  vtu_refine: 2
  gf: results_gf
  # The fields are saved every gf_interval-th time step, and at the last.
  gf_interval: 1
  csv: results_csv
